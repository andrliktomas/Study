# Každou hodinu spustí rozesílání připomínek lekcí (24 h předem).
# Nastavte v GitHubu: Settings → Secrets and variables → Actions
#   proměnná SITE_URL (např. https://lektorium.cz) a tajemství CRON_SECRET (stejné jako na serveru).
name: Připomínky lekcí

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Zavolat /api/cron/reminders
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL nebo CRON_SECRET není nastaven – přeskakuji."
            exit 0
          fi
          curl -fsS --retry 3 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
